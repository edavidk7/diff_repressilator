[project]
name = "differentiable-cell"
version = "0.1.0"
description = "Repressilator parameter inference by backpropagation through an ODE solver, against ABC-SMC, MAGI and an inverse PINN"
readme = "README.md"
authors = [
    { name = "David Korčák", email = "korcadav@fel.cvut.cz" }
]
requires-python = ">=3.13"
dependencies = [
    "fides>=0.8.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "sbi>=0.27.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchdiffeq>=0.2.5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
